name: Ticket monitor

on:
  workflow_dispatch:

concurrency:
  group: ticket-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: GOOGLE_CREDENTIALS_JSON
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Chromium for Playwright
        run: mvn -B --no-transfer-progress exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Collect tickets
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          TIMEZONE: Europe/Moscow
          DEBUG_DUMP: "0"     # сохранять сырые JSON tixbay в артефакт; после отладки поставьте "0"
        run: mvn -B --no-transfer-progress compile exec:java

      - name: Upload debug JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            debug/
            logs/
          if-no-files-found: ignore
          retention-days: 3

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID не заданы, уведомление пропущено"; exit 0
          fi
          TEXT="TEXT="❌ Обновление цен завершилось с ошибкой
          
          Сервис: Ticket monitor
          Логи запуска:
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" || true
