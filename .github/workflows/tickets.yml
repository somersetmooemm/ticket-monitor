name: Ticket monitor

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

concurrency:
  group: ticket-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    environment: GOOGLE_CREDENTIALS_JSON
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-1.48.0

      - name: Install system deps for Chromium (non-critical)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mvn -B --no-transfer-progress exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install-deps chromium"

      - name: Collect tickets
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          CLIENTS_SPREADSHEET_ID: ${{ secrets.CLIENTS_SPREADSHEET_ID }}
          TIMEZONE: Europe/Moscow
          DEBUG_DUMP: "0"
        run: mvn -B --no-transfer-progress compile exec:java

      - name: Upload debug JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            debug/
            logs/
          if-no-files-found: ignore
          retention-days: 3

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID не заданы, уведомление пропущено"; exit 0
          fi
          TEXT="❌ Обновление цен завершилось с ошибкой

          Сервис: Ticket monitor
          Логи запуска:
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" || true