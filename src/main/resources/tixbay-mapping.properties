# Как называются поля в JSON-ответах tixbay. Через запятую - варианты, берётся первый найденный.
# Если после первого запуска данных нет или они неверные - посмотрите артефакт "debug" в GitHub Actions
# и впишите сюда настоящие названия полей.
price=price,ticketPrice,salePrice,sellPrice,unitPrice
currency=currency,currencyCode,currencyName
section=area,areaName,zone,zoneName,section,sectionName,block,blockName
row=row,rowName,rowNo,rowNum,seatRow
seat=seat,seatNo,seatNum,seatNumber,seatName,seatCol,col
category=priceLevel,priceLevelName,category,categoryName,ticketCategory,ticketType,levelName,gradeName
qty=qty,quantity,stock,count,remain,remainCount
status=status,seatStatus,state,available,saleStatus
# Значения поля status, которые означают "место свободно" (в нижнем регистре)
available.values=available,free,true,1,on_sale,onsale,selling,normal
